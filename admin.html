<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>amiii_glow — админка</title><link rel="stylesheet" href="style.css"><style>
body{background:linear-gradient(135deg,#fff9fa,#f5e1e7)}.admin{max-width:1100px;margin:auto;padding:38px 5vw}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.panel{background:#fff;border:1px solid #eadde1;border-radius:24px;padding:24px;margin:20px 0;box-shadow:0 15px 50px #8b5d6c12}.login{max-width:440px;margin:8vh auto}.field{width:100%;padding:13px 14px;border:1px solid #eadde1;border-radius:12px;font:inherit;margin:7px 0;background:#fff}.formgrid{display:grid;grid-template-columns:1fr 180px;gap:10px}.status{font-size:13px;color:#8c747b}.item{display:grid;grid-template-columns:100px 1fr;gap:18px;padding:18px 0;border-bottom:1px solid #eadde1}.thumb{width:100px;height:100px;border-radius:15px;background:#f5e1e7;overflow:hidden;display:grid;place-items:center}.thumb img{width:100%;height:100%;object-fit:cover}.actions{display:flex;gap:8px;flex-wrap:wrap}.danger{border:0;background:#fff0f3;color:#a05f70;border-radius:30px;padding:10px 15px;cursor:pointer}.secondary{border:1px solid #eadde1;background:#fff;color:#3a252c;border-radius:30px;padding:10px 15px;cursor:pointer}.hidden{display:none}@media(max-width:650px){.formgrid{grid-template-columns:1fr}.item{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><header class="header"><a class="logo" href="index.html">amiii_<span>glow</span></a><a href="index.html">← В магазин</a></header><main class="admin">
<div id="login" class="panel login"><p class="eyebrow">AMIII_GLOW ADMIN</p><h1 style="font:600 42px 'Playfair Display';margin:8px 0">Вход</h1><p class="status">Только для администратора.</p><input id="email" class="field" type="email" placeholder="Email"><input id="password" class="field" type="password" placeholder="Пароль"><button class="primary" style="width:100%;margin-top:8px" onclick="login()">Войти</button><button class="secondary" style="width:100%;margin-top:10px" onclick="resetPassword()">Забыли пароль?</button><p id="loginStatus" class="status"></p></div>
<div id="dashboard" class="hidden"><div class="top"><div><p class="eyebrow">ADMIN PANEL</p><h1 style="font:600 50px 'Playfair Display';margin:8px 0">Магазин</h1><p class="status" id="status"></p></div><button class="secondary" onclick="logout()">Выйти</button></div>
<div class="panel"><h2 style="font-family:'Playfair Display'">Добавить товар</h2><div class="formgrid"><input id="name" class="field" placeholder="Название товара"><input id="price" class="field" type="number" placeholder="Цена, ₽"></div><input id="desc" class="field" placeholder="Описание"><input id="image" class="field" type="file" accept="image/*"><button class="primary" onclick="addProduct()">Добавить товар</button></div>
<div class="panel"><h2 style="font-family:'Playfair Display'">Товары</h2><div id="list"></div></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
